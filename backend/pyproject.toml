[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanyi-ai-task-os-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlmodel>=0.0.24,<0.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "bcrypt>=4.3,<6",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app"]
